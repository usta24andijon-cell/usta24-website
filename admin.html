
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>USTA24 — Admin Panel</title>
<style>
:root{
 --bg:#f3f5f9;--panel:#fff;--dark:#101827;--dark2:#1b2638;
 --text:#172033;--muted:#758096;--line:#e8ecf2;
 --blue:#3768f5;--green:#159b68;--red:#df4b55;--orange:#e69a32;
 --shadow:0 8px 30px rgba(20,35,60,.06);--radius:15px
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:Inter,Arial,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.layout{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--dark);color:white;
 position:fixed;inset:0 auto 0 0;padding:22px 15px;overflow:auto;z-index:5}
.brand{font-size:23px;font-weight:900;letter-spacing:1px;
 padding:8px 12px 25px}
.brand span{color:#6d91ff}
.brand small{display:block;font-size:10px;color:#8996aa;
 font-weight:500;letter-spacing:2px;margin-top:5px}
.nav-label{font-size:10px;color:#8290a5;padding:14px 12px 8px;
 text-transform:uppercase;letter-spacing:1.5px}
.nav button{width:100%;border:0;background:transparent;color:#c3ccda;
 padding:12px;border-radius:10px;text-align:left;margin:2px 0;
 display:flex;gap:12px;align-items:center;font-weight:600}
.nav button:hover,.nav button.active{background:#263752;color:white}
.nav button.active{box-shadow:inset 3px 0 #6c91ff}
.side-bottom{border-top:1px solid #2b3545;margin-top:25px;padding-top:15px}
.main{margin-left:250px;width:calc(100% - 250px);min-width:0}
.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 30px;position:sticky;top:0;z-index:3}
.top-title{font-size:18px;font-weight:800}
.top-right{display:flex;align-items:center;gap:12px;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:12px;background:#e9efff;
 color:var(--blue);display:grid;place-items:center;font-weight:900}
.content{padding:28px;max-width:1500px;margin:auto}
.page-head{display:flex;align-items:center;justify-content:space-between;
 gap:15px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:24px;margin:0 0 5px}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat,.panel{background:var(--panel);border:1px solid var(--line);
 border-radius:var(--radius);box-shadow:var(--shadow)}
.stat{padding:20px}
.stat-top{display:flex;justify-content:space-between;align-items:center;
 color:var(--muted);font-weight:600}
.stat-icon{width:38px;height:38px;border-radius:12px;
 display:grid;place-items:center;background:#edf2ff;font-size:18px}
.stat strong{display:block;font-size:27px;margin:15px 0 4px}
.stat small{color:var(--muted)}
.panel{padding:20px;margin-bottom:18px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;
 gap:12px;margin-bottom:17px;flex-wrap:wrap}
.panel h2{font-size:17px;margin:0}
.btn{border:0;border-radius:9px;padding:10px 15px;
 font-weight:700;display:inline-flex;align-items:center;gap:7px}
.primary{background:var(--blue);color:white}
.secondary{background:#eef2f8;color:#34415a}
.success{background:#e6f7ef;color:#087c50}
.danger{background:#fff0f0;color:var(--red)}
.warning{background:#fff5e5;color:#a66b10}
.btn:hover{filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:6px;flex-wrap:wrap}
input,select,textarea{width:100%;border:1px solid #dfe4ed;
 border-radius:9px;padding:11px 12px;background:#fff;color:var(--text);
 outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);
 box-shadow:0 0 0 3px #3768f51a}
textarea{resize:vertical;min-height:80px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;margin-bottom:7px;font-size:12px}
.field small{display:block;color:var(--muted);margin-top:5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.table-wrap{width:100%;overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:800;
 text-transform:uppercase;letter-spacing:.5px;background:#f8f9fc}
td,th{padding:13px 12px;border-bottom:1px solid var(--line)}
td{font-size:13px}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:5px 9px;border-radius:20px;
 background:#eef2f8;color:#566178;font-size:11px;font-weight:800}
.tag.green{background:#e4f7ed;color:#128256}
.tag.orange{background:#fff3df;color:#a76b13}
.tag.red{background:#ffeded;color:#c33e49}
.tag.blue{background:#eaf0ff;color:#345ce0}
.empty{text-align:center;color:var(--muted);padding:35px}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:17px}
.login-screen{min-height:100vh;display:grid;place-items:center;
 background:linear-gradient(135deg,#101827,#1e355a);padding:20px}
.login-card{width:min(420px,100%);background:white;border-radius:20px;
 padding:32px;box-shadow:0 20px 70px #0004}
.login-logo{font-size:30px;font-weight:900;margin-bottom:8px}
.login-logo span{color:var(--blue)}
.login-card h2{margin:20px 0 6px}
.login-card p{color:var(--muted);margin-bottom:22px}
.login-card .btn{width:100%;justify-content:center;padding:13px}
.modal-bg{position:fixed;inset:0;background:#11182799;z-index:20;
 display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{width:min(650px,100%);max-height:92vh;overflow:auto;
 background:white;border-radius:17px;padding:23px;box-shadow:0 20px 70px #0004}
.modal-head{display:flex;justify-content:space-between;align-items:center;
 margin-bottom:20px}
.modal-head h2{margin:0;font-size:19px}
.close{border:0;background:#f0f2f6;border-radius:9px;width:34px;height:34px}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:white;
 padding:13px 18px;border-radius:10px;z-index:50;display:none;
 box-shadow:var(--shadow);max-width:90vw}
.toast.show{display:block}
.mobile-menu{display:none}
.muted{color:var(--muted)}
.worker-hint{background:#edf7ff;border:1px solid #d8eaff;
 border-radius:10px;padding:12px;color:#315a8d;margin:8px 0 15px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
 .sidebar{transform:translateX(-100%);transition:.2s}
 .sidebar.open{transform:translateX(0)}
 .main{margin-left:0;width:100%}
 .topbar{padding:0 15px;height:62px}
 .content{padding:17px 13px}
 .mobile-menu{display:inline-flex}
 .grid{grid-template-columns:1fr 1fr;gap:9px}
 .stat{padding:14px}.stat strong{font-size:21px}
 .two-col{grid-template-columns:1fr}
 .form-grid{grid-template-columns:1fr}
 .page-head h1{font-size:21px}
}
@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login" class="login-screen">
 <div class="login-card">
  <div class="login-logo">USTA<span>24</span></div>
  <div class="sub">ANDIJON · ADMINISTRATOR PANELI</div>
  <h2>Xush kelibsiz!</h2>
  <p>Davom etish uchun admin parolini kiriting.</p>
  <form id="loginForm">
   <div class="field">
    <label>Admin paroli</label>
    <input id="password" type="password" placeholder="Parolni kiriting" required>
   </div>
   <button class="btn primary" type="submit">Panelga kirish →</button>
  </form>
  <div id="loginError" class="sub" style="color:#d44;margin-top:12px"></div>
 </div>
</div>

<div id="app" class="layout" style="display:none">
 <aside class="sidebar" id="sidebar">
  <div class="brand">USTA<span>24</span><small>ADMINISTRATION</small></div>
  <div class="nav">
   <div class="nav-label">Asosiy</div>
   <button class="active" data-page="dashboard">▦ Dashboard</button>
   <button data-page="orders">▤ Buyurtmalar</button>
   <button data-page="workers">♙ Ustalar</button>
   <button data-page="customers">♧ Mijozlar</button>
   <div class="nav-label">Boshqaruv</div>
   <button data-page="services">⚒ Xizmatlar</button>
   <button data-page="finance">▣ Moliya</button>
   <button data-page="expenses">↘ Xarajatlar</button>
   <button data-page="reviews">☆ Sharhlar</button>
   <button data-page="ads">◉ Reklama</button>
   <div class="nav-label">Tizim</div>
   <button data-page="settings">⚙ Sozlamalar</button>
  </div>
  <div class="side-bottom">
   <button class="btn danger" style="width:100%;justify-content:center"
    onclick="logout()">Chiqish</button>
  </div>
 </aside>

 <main class="main">
  <header class="topbar">
   <div style="display:flex;align-items:center;gap:12px">
    <button class="btn secondary mobile-menu" onclick="toggleMenu()">☰</button>
    <div class="top-title" id="topTitle">Dashboard</div>
   </div>
   <div class="top-right"><span>Administrator</span><div class="avatar">U</div></div>
  </header>
  <section class="content" id="content"></section>
 </main>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
 <div class="modal">
  <div class="modal-head"><h2 id="modalTitle">Ma’lumot</h2>
   <button class="close" onclick="closeModal()">✕</button></div>
  <div id="modalBody"></div>
  <div class="modal-foot" id="modalFoot"></div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API="/api/admin";
let token=sessionStorage.getItem("usta24_admin_token")||"";
let currentPage="dashboard";
let cachedWorkers=[];

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const money=v=>new Intl.NumberFormat("uz-UZ").format(Number(v)||0)+" so‘m";
const number=v=>Number(v)||0;

function toast(message){
 $("toast").textContent=message;
 $("toast").classList.add("show");
 setTimeout(()=>$("toast").classList.remove("show"),3200);
}
function showModal(title,body,buttons){
 $("modalTitle").textContent=title;
 $("modalBody").innerHTML=body;
 $("modalFoot").innerHTML=buttons||'<button class="btn secondary" onclick="closeModal()">Yopish</button>';
 $("modalBg").classList.add("show");
}
function closeModal(){$("modalBg").classList.remove("show")}
function toggleMenu(){$("sidebar").classList.toggle("open")}
function logout(){
 sessionStorage.removeItem("usta24_admin_token");
 token="";$("app").style.display="none";$("login").style.display="grid";
 $("password").value="";
}
async function api(path,method="GET",data){
 const options={method,headers:{"Authorization":"Bearer "+token}};
 if(data!==undefined){
  options.headers["Content-Type"]="application/json";
  options.body=JSON.stringify(data);
 }
 const response=await fetch(API+path,options);
 let result={};
 try{result=await response.json()}catch(e){}
 if(!response.ok||result.success===false){
  throw new Error(result.error||"Server xatosi: "+response.status);
 }
 return result;
}
async function loadWorkers(){
 const d=await api("/ustalar");
 cachedWorkers=d.ustalar||[];
 return cachedWorkers;
}
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const p=$("password").value;
 $("loginError").textContent="Tekshirilmoqda...";
 token=p;
 try{
  await api("/stats");
  sessionStorage.setItem("usta24_admin_token",token);
  $("login").style.display="none";$("app").style.display="flex";
  openPage("dashboard");
 }catch(err){
  token="";$("loginError").textContent=err.message||"Parol noto‘g‘ri";
 }
});

document.querySelectorAll(".nav button[data-page]").forEach(b=>{
 b.addEventListener("click",()=>openPage(b.dataset.page));
});

const pageNames={
 dashboard:"Dashboard",orders:"Buyurtmalar",workers:"Ustalar",
 customers:"Mijozlar",services:"Xizmatlar",finance:"Moliya",
 expenses:"Xarajatlar",reviews:"Sharhlar",ads:"Reklama",
 settings:"Sozlamalar"
};
async function openPage(page){
 currentPage=page;
 $("topTitle").textContent=pageNames[page]||page;
 document.querySelectorAll(".nav button").forEach(b=>
  b.classList.toggle("active",b.dataset.page===page));
 $("sidebar").classList.remove("open");
 $("content").innerHTML='<div class="panel empty">Yuklanmoqda...</div>';
 try{
  const fn={
   dashboard,orders,workers,customers,services,finance,
   expenses,reviews,ads,settings
  }[page];
  await fn();
 }catch(e){
  $("content").innerHTML='<div class="panel"><b style="color:#d44">Xatolik:</b> '+esc(e.message)+
   '<br><br><button class="btn secondary" onclick="openPage(currentPage)">Qayta urinish</button></div>';
 }
}
function pageHead(title,subtitle,button=""){
 return '<div class="page-head"><div><h1>'+title+'</h1><div class="sub">'+subtitle+
 '</div></div>'+button+'</div>';
}
function table(headers,rows){
 return '<div class="table-wrap"><table><thead><tr>'+
 headers.map(x=>'<th>'+x+'</th>').join("")+
 '</tr></thead><tbody>'+
 (rows.length?rows.join(""):'<tr><td colspan="'+headers.length+
 '" class="empty">Hozircha ma’lumot yo‘q</td></tr>')+
 '</tbody></table></div>';
}
function statCard(label,value,icon,sub){
 return '<div class="stat"><div class="stat-top"><span>'+label+
 '</span><span class="stat-icon">'+icon+'</span></div><strong>'+
 value+'</strong><small>'+sub+'</small></div>';
}
function tag(status){
 let c="";
 if(["Tugallandi","Faol","To‘landi","To'landi","Tasdiqlandi"].includes(status))c="green";
 else if(["Bajarilmoqda","Kutilmoqda","Qabul qilindi"].includes(status))c="orange";
 else if(["Bekor qilindi","Nofaol","Rad etildi"].includes(status))c="red";
 else if(["Ustaga biriktirildi"].includes(status))c="blue";
 return '<span class="tag '+c+'">'+esc(status||"—")+'</span>';
}

// DASHBOARD
async function dashboard(){
 const d=await api("/stats"),s=d.stats||{};
 $("content").innerHTML=pageHead("Dashboard","USTA24 faoliyati bo‘yicha umumiy ko‘rsatkichlar")+
 '<div class="grid">'+
 statCard("Jami buyurtmalar",number(s.total),"▤","Barcha buyurtmalar")+
 statCard("Yangi buyurtmalar",number(s.new_orders),"✚","Yangi kelganlar")+
 statCard("Jarayondagi buyurtmalar",number(s.in_progress),"⚒","Bajarilayotgan ishlar")+
 statCard("Tugallangan buyurtmalar",number(s.completed),"✓","Yakunlangan ishlar")+
 statCard("Komissiya jami",money(s.commission_revenue??s.commission_total),"₮","USTA24 komissiyasi")+
 statCard("To‘langan",money(s.commission_paid??s.paid_total),"✓","To‘langan komissiya")+
 statCard("Kutilmoqda",money(s.commission_pending??s.pending_total),"◷","Kutilayotgan komissiya")+
 statCard("Xarajatlar",money(s.expenses),"↘","Jami xarajatlar")+
 '</div><div class="panel" style="margin-top:18px"><h2>Tezkor amallar</h2><br>'+
 '<div class="actions"><button class="btn primary" onclick="openPage(\'orders\')">Buyurtmalarni ko‘rish</button>'+
 '<button class="btn secondary" onclick="openPage(\'workers\')">Ustalarni boshqarish</button>'+
 '<button class="btn secondary" onclick="openPage(\'finance\')">Moliyani ko‘rish</button></div></div>';
}

// ORDERS
async function orders(){
 const d=await api("/orders");
 const rows=(d.orders||[]).map(o=>
 '<tr><td><b>#'+esc(o.id)+'</b></td>'+
 '<td><b>'+esc(o.name)+'</b><br><span class="muted">'+esc(o.phone)+'</span></td>'+
 '<td>'+esc(o.service)+'</td><td>'+esc(o.address)+'</td>'+
 '<td><b>'+money(o.price??o.finance_price)+'</b></td>'+
 '<td>'+tag(o.status)+'</td>'+
 '<td>'+esc(o.worker_name||"Biriktirilmagan")+
 (o.worker_phone?'<br><span class="muted">'+esc(o.worker_phone)+'</span>':"")+'</td>'+
 '<td><button class="btn secondary" onclick="editOrder('+Number(o.id)+')">Tahrirlash</button></td></tr>'
 );
 $("content").innerHTML=pageHead("Buyurtmalar","Buyurtmalarni ko‘rish, usta biriktirish va narx belgilash",
 '<button class="btn primary" onclick="addOrder()">＋ Buyurtma qo‘shish</button>')+
 '<div class="panel">'+table(["ID","Mijoz","Xizmat","Manzil","Narx","Holat","Usta","Amal"],rows)+'</div>';
}
async function addOrder(){
 showModal("Yangi buyurtma",
 '<div class="form-grid">'+
 field("Mijoz ismi","newName")+
 field("Telefon raqami","newPhone")+
 field("Xizmat turi","newService")+
 field("Manzil","newAddress")+
 field("Narx (so‘m)","newPrice","number")+
 '<div class="field"><label>Manba</label><select id="newSource"><option>Telefon</option><option>Instagram</option><option>Telegram</option><option>Veb-sayt</option><option selected>Boshqa</option></select></div>'+
 '</div><div class="field"><label>Izoh</label><textarea id="newDetails"></textarea></div>',
 '<button class="btn secondary" onclick="closeModal()">Bekor qilish</button>'+
 '<button class="btn primary" onclick="saveNewOrder()">Saqlash</button>');
}
function field(label,id,type="text",value=""){
 return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(value)+'"></div>';
}
async function saveNewOrder(){
 try{
  const name=$("newName").value.trim(),phone=$("newPhone").value.trim();
  const service=$("newService").value.trim(),address=$("newAddress").value.trim();
  const price=Number($("newPrice").value||0);
  if(!name||!phone||!service||!address)throw new Error("Majburiy maydonlarni to‘ldiring");
  const d=await api("/orders","POST",{
   name,phone,service,address,
   details:$("newDetails").value,
   source:$("newSource").value
  });
  const id=d.id||d.orderId;
  if(price>0&&id)await api("/orders/"+id,"PATCH",{price});
  closeModal();toast("Buyurtma saqlandi");orders();
 }catch(e){toast(e.message)}
}
async function editOrder(id){
 try{
  const [d,workersData]=await Promise.all([api("/orders"),loadWorkers()]);
  const o=(d.orders||[]).find(x=>Number(x.id)===Number(id));
  if(!o)throw new Error("Buyurtma topilmadi");
  const workerOptions='<option value="">— Usta tanlanmagan —</option>'+
   cachedWorkers.map(w=>'<option value="'+Number(w.id)+'" '+
    (w.name===o.worker_name&&w.phone===o.worker_phone?"selected":"")+'>'+
    esc(w.name)+' — '+esc(w.phone)+'</option>').join("");
  const body=
   '<div class="form-grid">'+
   field("Mijoz ismi","editName","text",o.name)+
   field("Telefon","editPhone","text",o.phone)+
   field("Xizmat","editService","text",o.service)+
   field("Manzil","editAddress","text",o.address)+
   '<div class="field"><label>Buyurtma narxi (so‘m)</label><input id="editPrice" type="number" min="0" value="'+esc(o.price??o.finance_price??0)+'"></div>'+
   '<div class="field"><label>Buyurtma holati</label><select id="editStatus">'+
   ["Yangi","Qabul qilindi","Ustaga biriktirildi","Bajarilmoqda","Tugallandi","Bekor qilindi"].map(s=>
    '<option '+(o.status===s?"selected":"")+'>'+s+'</option>').join("")+
   '</select></div></div>'+
   '<div class="field"><label>Faol ustani tanlang</label><select id="editWorker" onchange="workerSelected()">'+workerOptions+'</select>'+
   '<small>Ustani tanlasangiz, uning ismi va telefon raqami avtomatik chiqadi.</small></div>'+
   '<div class="worker-hint" id="workerInfo">Usta tanlanmagan</div>'+
   '<div class="field"><label>Usta ismi</label><input id="workerName" readonly value="'+esc(o.worker_name||"")+'"></div>'+
   '<div class="field"><label>Usta telefon raqami</label><input id="workerPhone" readonly value="'+esc(o.worker_phone||"")+'"></div>'+
   '<div class="field"><label>Izoh</label><textarea id="editDetails">'+esc(o.details||"")+'</textarea></div>';
  showModal("Buyurtma #"+id,body,
   '<button class="btn secondary" onclick="closeModal()">Bekor qilish</button>'+
   '<button class="btn primary" onclick="saveOrder('+Number(id)+')">Saqlash</button>');
  $("editWorker").dataset.oldName=o.worker_name||"";
  $("editWorker").dataset.oldPhone=o.worker_phone||"";
  workerSelected();
 }catch(e){toast(e.message)}
}
function workerSelected(){
 const id=Number($("editWorker").value);
 const w=cachedWorkers.find(x=>Number(x.id)===id);
 if(w){
  $("workerName").value=w.name;
  $("workerPhone").value=w.phone;
  $("workerInfo").textContent="✓ Tanlandi: "+w.name+" · "+w.phone;
 }else{
  $("workerName").value="";
  $("workerPhone").value="";
  $("workerInfo").textContent="Usta tanlanmagan. Faol ustalardan birini tanlang.";
 }
}
async function saveOrder(id){
 try{
  const price=Number($("editPrice").value);
  const status=$("editStatus").value;
  if(!Number.isFinite(price)||price<0)throw new Error("Narxni to‘g‘ri kiriting");
  if(status==="Tugallandi"&&price<=0)throw new Error("Ishni tugatish uchun narx kiriting");
  const workerId=Number($("editWorker").value);
  const selected=cachedWorkers.find(w=>Number(w.id)===workerId);

  // 1. Ustani alohida biriktirish
  if(selected){
   await api("/orders/"+id,"PATCH",{
    worker_name:selected.name,
    worker_phone:selected.phone
   });
  }

  // 2. Buyurtma ma'lumotlari va narxni saqlash
  await api("/orders/"+id,"PATCH",{
   name:$("editName").value.trim(),
   phone:$("editPhone").value.trim(),
   service:$("editService").value.trim(),
   address:$("editAddress").value.trim(),
   details:$("editDetails").value,
   price:price,
   status:status
  });

  closeModal();
