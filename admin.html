
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USTA 24 — Admin panel</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    header {
      background: #10233f;
      color: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    h1 { margin: 0 0 8px; }

    .login, .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px #0000000d;
    }

    input, select, button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 15px;
    }

    input {
      width: 100%;
      margin: 8px 0;
    }

    button {
      cursor: pointer;
      background: #1769e0;
      color: white;
      border: none;
      margin: 4px 3px 4px 0;
    }

    button:hover { opacity: .9; }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0000000d;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 8px;
    }

    .order, .worker {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 10px #0000000d;
    }

    .order p, .worker p { margin: 8px 0; }

    .order select, .worker select {
      margin-top: 10px;
      width: 100%;
      max-width: 400px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .form-grid input, .form-grid select {
      width: 100%;
      margin: 0;
    }

    .hidden { display: none; }

    .muted { color: #64748b; }

    .danger { background: #dc2626; }
    .secondary { background: #64748b; }
    .success { background: #15803d; }

    .message {
      margin-top: 12px;
      font-weight: bold;
    }

    .active {
      color: #15803d;
      font-weight: bold;
    }

    .inactive {
      color: #dc2626;
      font-weight: bold;
    }

    .section-title {
      margin-top: 28px;
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
<div class="container">

  <header>
    <h1>🛠 USTA 24</h1>
    <p>Administrator boshqaruv paneli</p>
  </header>

  <!-- ADMIN KIRISH -->
  <section class="login" id="login">
    <h2>Admin panelga kirish</h2>

    <input
      type="password"
      id="password"
      placeholder="Admin parolini kiriting"
    >

    <button onclick="loginAdmin()">Kirish</button>

    <p id="message" class="message"></p>
  </section>

  <!-- ASOSIY PANEL -->
  <section id="dashboard" class="hidden">

    <button onclick="loadDashboard()">🔄 Yangilash</button>

    <button onclick="logout()" class="secondary">
      Chiqish
    </button>

    <!-- STATISTIKA -->
    <h2 class="section-title">📊 Buyurtmalar statistikasi</h2>

    <div class="stats">
      <div class="stat">
        Jami buyurtmalar
        <strong id="total">0</strong>
      </div>

      <div class="stat">
        Yangi
        <strong id="newOrders">0</strong>
      </div>

      <div class="stat">
        Bajarilmoqda
        <strong id="progress">0</strong>
      </div>

      <div class="stat">
        Tugallangan
        <strong id="completed">0</strong>
      </div>
    </div>

    <!-- USTA QO'SHISH -->
    <div class="card">
      <h2>➕ Yangi usta qo‘shish</h2>

      <form id="workerForm">
        <div class="form-grid">

          <input
            type="text"
            id="workerName"
            placeholder="Ustaning ismi"
            required
          >

          <input
            type="tel"
            id="workerPhone"
            placeholder="Telefon raqami"
            required
          >

          <input
            type="text"
            id="workerSpecialty"
            placeholder="Mutaxassisligi"
          >

          <select id="workerStatus">
            <option value="Faol">Faol</option>
            <option value="Nofaol">Nofaol</option>
          </select>

        </div>

        <br>

        <button type="submit" id="saveWorker">
          Ustani qo‘shish
        </button>

        <button
          type="button"
          class="secondary hidden"
          id="cancelEdit"
          onclick="cancelWorkerEdit()"
        >
          Bekor qilish
        </button>

        <p id="workerMessage" class="message"></p>
      </form>
    </div>

    <!-- USTALAR RO'YXATI -->
    <h2>👷 Ustalar ro‘yxati</h2>

    <div id="workers">
      Ustalar yuklanmoqda...
    </div>

    <!-- BUYURTMALAR -->
    <h2 class="section-title">📋 Buyurtmalar</h2>

    <div id="orders">
      Buyurtmalar yuklanmoqda...
    </div>

  </section>
</div>

<script>
  let adminPassword = "";
  let editingWorkerId = null;
  let workersList = [];

  const statuses = [
    "Yangi",
    "Qabul qilindi",
    "Ustaga biriktirildi",
    "Bajarilmoqda",
    "Tugallandi",
    "Bekor qilindi"
  ];

  // =====================================
  // API BILAN ISHLASH
  // =====================================

  async function api(path, options = {}) {
    const response = await fetch(path, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + adminPassword,
        ...(options.headers || {})
      }
    });

    let result;

    try {
      result = await response.json();
    } catch {
      throw new Error("Serverdan noto'g'ri javob keldi");
    }

    if (!response.ok) {
      throw new Error(result.error || "Xatolik yuz berdi");
    }

    return result;
  }

  // =====================================
  // ADMIN KIRISH
  // =====================================

  async function loginAdmin() {
    const password =
      document.getElementById("password").value.trim();

    const message =
      document.getElementById("message");

    if (!password) {
      message.textContent = "Parolni kiriting.";
      return;
    }

    adminPassword = password;

    try {
      await api("/api/admin/stats");

      document.getElementById("login").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");

      await loadDashboard();

    } catch (error) {
      adminPassword = "";
      message.textContent =
        "Kirish amalga oshmadi: " + error.message;
    }
  }

  // =====================================
  // BARCHA MA'LUMOTLARNI YUKLASH
  // =====================================

  async function loadDashboard() {
    try {
      await loadStats();
      await loadWorkers();
      await loadOrders();

    } catch (error) {
      alert("Ma'lumotlarni yuklashda xatolik: " + error.message);
    }
  }

  // =====================================
  // STATISTIKA
  // =====================================

  async function loadStats() {
    const result = await api("/api/admin/stats");
    const stats = result.stats;

    document.getElementById("total").textContent =
      stats.total || 0;

    document.getElementById("newOrders").textContent =
      stats.new_orders || 0;

    document.getElementById("progress").textContent =
      stats.in_progress || 0;

    document.getElementById("completed").textContent =
      stats.completed || 0;
  }

  // =====================================
  // BUYURTMALAR RO'YXATI
  // =====================================

  async function loadOrders() {
    const box = document.getElementById("orders");

    box.textContent = "Yuklanmoqda...";

    const data = await api("/api/admin/orders");

    box.replaceChildren();

    if (!data.orders.length) {
      box.textContent = "Hozircha buyurtmalar yo'q.";
      return;
    }

    data.orders.forEach(order => {
      const card = document.createElement("div");
      card.className = "order";

      const title = document.createElement("h3");
      title.textContent = "📋 Buyurtma #" + order.id;
      card.appendChild(title);

      const fields = [
        ["Ism", order.name],
        ["Telefon", order.phone],
        ["Xizmat", order.service],
        ["Manzil", order.address],
        ["Izoh", order.details || "Yo'q"],
        ["Sana", order.created_at || ""],
        ["Biriktirilgan usta", order.worker_name || "Hali biriktirilmagan"],
        ["Usta telefoni", order.worker_phone || "—"]
      ];

      fields.forEach(([label, value]) => {
        const p = document.createElement("p");
        p.textContent = label + ": " + (value ?? "");
        card.appendChild(p);
      });

      // BUYURTMA HOLATI
      const statusLabel = document.createElement("p");
      statusLabel.textContent = "Buyurtma holati:";
      card.appendChild(statusLabel);

      const statusSelect = document.createElement("select");

      statuses.forEach(status => {
        const option = document.createElement("option");
        option.value = status;
        option.textContent = status;
        option.selected = status === order.status;
        statusSelect.appendChild(option);
      });

      statusSelect.addEventListener("change", async () => {
        const oldStatus = order.status;
        statusSelect.disabled = true;

        try {
          await api("/api/admin/orders/" + order.id, {
            method: "PATCH",
            body: JSON.stringify({
              status: statusSelect.value
            })
          });

          order.status = statusSelect.value;
          await loadStats();

        } catch (error) {
          alert("Holatni o'zgartirib bo'lmadi: " + error.message);
          statusSelect.value = oldStatus;
        } finally {
          statusSelect.disabled = false;
        }
      });

      card.appendChild(statusSelect);

      // USTANI TANLASH
      const workerLabel = document.createElement("p");
      workerLabel.textContent = "👷 Buyurtmaga usta tanlang:";
      card.appendChild(workerLabel);

      const workerSelect = document.createElement("select");
      workerSelect.style.display = "block";

      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Ustani tanlang";
      workerSelect.appendChild(placeholder);

      const activeWorkers = workersList.filter(
        worker => worker.status === "Faol"
      );

      activeWorkers.forEach(worker => {
        const option = document.createElement("option");

        option.value = String(worker.id);
        option.textContent =
          worker.name + " — " + worker.phone;

        if (
          worker.name === order.worker_name &&
          worker.phone === order.worker_phone
        ) {
          option.selected = true;
        }

        workerSelect.appendChild(option);
      });

      card.appendChild(workerSelect);

      // BIRIKTIRISH TUGMASI
      const assignButton = document.createElement("button");
      assignButton.textContent = "Ustaga biriktirish";
      assignButton.className = "success";

      assignButton.addEventListener("click", async () => {
        const worker = workersList.find(
          item => String(item.id) === workerSelect.value
        );

        if (!worker || worker.status !== "Faol") {
          alert("Avval faol ustani tanlang.");
          return;
        }

        const confirmed = confirm(
          worker.name + " ustasini #" + order.id +
          " buyurtmaga biriktirasizmi?"
        );

        if (!confirmed) return;

        assignButton.disabled = true;

        try {
          await api("/api/admin/orders/" + order.id, {
            method: "PATCH",
            body: JSON.stringify({
              worker_name: worker.name,
              worker_phone: worker.phone
            })
          });

          alert("Usta buyurtmaga muvaffaqiyatli biriktirildi!");

          await loadStats();
          await loadOrders();

        } catch (error) {
          alert("Biriktirishda xatolik: " + error.message);
        } finally {
          assignButton.disabled = false;
        }
      });

      card.appendChild(assignButton);
      box.appendChild(card);
    });
  }

  // =====================================
  // USTALAR RO'YXATINI YUKLASH
  // =====================================

  async function loadWorkers() {
    const box = document.getElementById("workers");

    box.textContent = "Ustalar yuklanmoqda...";

    const data = await api("/api/admin/ustalar");

    workersList = data.ustalar || [];

    box.replaceChildren();

    if (!workersList.length) {
      box.textContent = "Hozircha ustalar mavjud emas.";
      return;
    }

    workersList.forEach(worker => {
      const card = document.createElement("div");
      card.className = "worker";

      const title = document.createElement("h3");
      title.textContent = "👷 " + worker.name;
      card.appendChild(title);

      const fields = [
        ["ID", worker.id],
        ["Telefon", worker.phone],
        ["Mutaxassislik", worker.specialty || "Ko'rsatilmagan"]
      ];

      fields.forEach(([label, value]) => {
        const p = document.createElement("p");
        p.textContent = label + ": " + (value ?? "");
        card.appendChild(p);
      });

      const status = document.createElement("p");
      status.textContent = "Holati: " + worker.status;

      status.className =
        worker.status === "Faol" ? "active" : "inactive";

      card.appendChild(status);

      const editButton = document.createElement("button");
      editButton.textContent = "✏️ Tahrirlash";

      editButton.addEventListener("click", () => {
        editWorker(worker);
      });

      card.appendChild(editButton);

      const deleteButton = document.createElement("button");
      deleteButton.textContent = "🗑 O'chirish";
      deleteButton.className = "danger";

      deleteButton.addEventListener("click", () => {
        deleteWorker(worker.id, worker.name);
      });

      card.appendChild(deleteButton);

      box.appendChild(card);
    });
  }

  // =====================================
  // USTA QO'SHISH VA TAHRIRLASH
  // =====================================

  document.getElementById("workerForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const name =
        document.getElementById("workerName").value.trim();

      const phone =
        document.getElementById("workerPhone").value.trim();

      const specialty =
        document.getElementById("workerSpecialty").value.trim();

      const status =
        document.getElementById("workerStatus").value;

      const message =
        document.getElementById("workerMessage");

      const button =
        document.getElementById("saveWorker");

      if (!name || !phone) {
        message.textContent = "Ism va telefonni kiriting.";
        return;
      }

      button.disabled = true;
      message.textContent = "Saqlanmoqda...";

      const workerData = {
        name,
        phone,
        specialty,
        status
      };

      try {
        if (editingWorkerId !== null) {

          await api("/api/admin/ustalar/" + editingWorkerId, {
            method: "PATCH",
            body: JSON.stringify(workerData)
          });

          message.textContent = "Usta muvaffaqiyatli yangilandi!";

        } else {

          await api("/api/admin/ustalar", {
            method: "POST",
            body: JSON.stringify(workerData)
          });

          message.textContent = "Yangi usta muvaffaqiyatli qo'shildi!";
        }

        this.reset();
        editingWorkerId = null;

        document.getElementById("saveWorker").textContent =
          "Ustani qo'shish";

        document.getElementById("cancelEdit")
          .classList.add("hidden");

        await loadWorkers();
        await loadOrders();

      } catch (error) {
        message.textContent = "Xatolik: " + error.message;
      } finally {
        button.disabled = false;
      }
    });

  // =====================================
  // USTANI TAHRIRLASH
  // =====================================

  function editWorker(worker) {
    editingWorkerId = worker.id;

    document.getElementById("workerName").value =
      worker.name || "";

    document.getElementById("workerPhone").value =
      worker.phone || "";

    document.getElementById("workerSpecialty").value =
      worker.specialty || "";

    document.getElementById("workerStatus").value =
      worker.status || "Faol";

    document.getElementById("saveWorker").textContent =
      "O'zgarishlarni saqlash";

    document.getElementById("cancelEdit")
      .classList.remove("hidden");

    document.getElementById("workerMessage").textContent =
      "Usta #" + worker.id + " tahrirlanmoqda.";

    document.getElementById("workerForm")
      .scrollIntoView({ behavior: "smooth" });
  }

  // =====================================
  // TAHRIRLASHNI BEKOR QILISH
  // =====================================

  function cancelWorkerEdit() {
    editingWorkerId = null;

    document.getElementById("workerForm").reset();

    document.getElementById("saveWorker").textContent =
      "Ustani qo'shish";

    document.getElementById("cancelEdit")
      .classList.add("hidden");

    document.getElementById("workerMessage").textContent = "";
  }

  // =====================================
  // USTANI O'CHIRISH
  // =====================================

  async function deleteWorker(id, name) {
    const confirmed = confirm(
      name + " ismli ustani o'chirmoqchimisiz?"
    );

    if (!confirmed) return;

    try {
      await api("/api/admin/ustalar/" + id, {
        method: "DELETE"
      });

      alert("Usta muvaffaqiyatli o'chirildi.");

      if (editingWorkerId === id) {
        cancelWorkerEdit();
      }

      await loadWorkers();
      await loadOrders();

    } catch (error) {
      alert("O'chirishda xatolik: " + error.message);
    }
  }

  // =====================================
  // ADMIN PANELDAN CHIQISH
  // =====================================

  function logout() {
    adminPassword = "";
    editingWorkerId = null;
    workersList = [];

    document.getElementById("password").value = "";

    document.getElementById("dashboard")
      .classList.add("hidden");

    document.getElementById("login")
      .classList.remove("hidden");

    cancelWorkerEdit();
  }

  // ENTER BOSILGANDA KIRISH
  document.getElementById("password")
    .addEventListener("keydown", event => {
      if (event.key === "Enter") {
        loginAdmin();
      }
    });

</script>
</body>
</html>
