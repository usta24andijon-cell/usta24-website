
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USTA24 — Admin Panel</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--dark:#172033;--muted:#778197;--blue:#315efb;--line:#e8ebf2;--green:#16a36a;--red:#e34d59}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--dark)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-box{background:white;padding:35px;border-radius:20px;width:100%;max-width:390px;box-shadow:0 15px 50px #1a2b5015}
.logo{font-size:27px;font-weight:900;color:var(--blue);letter-spacing:1px}
.login-box p{color:var(--muted)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0 13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.primary{background:var(--blue);color:white;padding:12px 17px;border-radius:10px;font-weight:700}
.secondary{background:#edf1ff;color:var(--blue);padding:9px 13px;border-radius:9px;font-weight:600}
.danger{background:#fff0f0;color:var(--red);padding:9px 12px;border-radius:9px}
.app{display:none;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:245px;background:#172033;color:white;padding:25px 16px;overflow:auto}
.brand{font-size:25px;font-weight:900;padding:5px 12px 28px;color:white}
.brand span{color:#6f91ff}
.nav-title{font-size:11px;color:#8792aa;padding:15px 12px 8px;text-transform:uppercase;letter-spacing:1px}
.nav button{width:100%;text-align:left;padding:12px;border-radius:10px;background:transparent;color:#c6ccda;margin:2px 0}
.nav button.active,.nav button:hover{background:#2c3b5c;color:white}
.main{margin-left:245px;padding:28px;max-width:1600px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px;gap:12px}
.topbar h1{font-size:25px;margin:0}
.user{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:19px}
.card small{color:var(--muted)}
.metric{font-size:27px;font-weight:800;margin-top:10px}
.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:18px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.panel h2{font-size:17px;margin:0}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{text-align:left;padding:13px 11px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:600;background:#fafbfe}
td{line-height:1.5}
.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf1ff;color:#315efb;font-size:11px}
.tag.green{background:#e7f8ef;color:#168653}
.tag.red{background:#fff0f0;color:#d84955}
.muted{color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{font-size:12px}
.empty{text-align:center;padding:30px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mobile-menu{display:none}
#toast{position:fixed;right:20px;bottom:20px;background:#172033;color:white;padding:13px 18px;border-radius:10px;display:none;z-index:20;max-width:90%}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
.sidebar{display:none;width:245px;z-index:10}
.sidebar.open{display:block}
.main{margin:0;padding:16px}
.mobile-menu{display:inline-block;background:#e9edff;color:var(--blue);padding:9px 12px;border-radius:9px}
.topbar{align-items:flex-start}
.topbar h1{font-size:20px}
.cards{gap:9px}
.card{padding:14px}
.metric{font-size:21px}
.grid2,.form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-box">
    <div class="logo">USTA<span style="color:#172033">24</span></div>
    <h2>Admin panelga kirish</h2>
    <p>Boshqaruv panelidan foydalanish uchun parolni kiriting.</p>
    <form id="loginForm">
      <input id="password" type="password" placeholder="Admin paroli" required>
      <button class="primary" style="width:100%">Kirish</button>
    </form>
    <p id="loginError" style="color:#e34d59"></p>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">USTA<span>24</span></div>
    <div class="nav">
      <div class="nav-title">Asosiy</div>
      <button class="active" data-page="dashboard">▦ Boshqaruv paneli</button>
      <button data-page="orders">▤ Buyurtmalar</button>
      <button data-page="workers">♙ Ustalar</button>
      <button data-page="customers">♧ Mijozlar</button>
      <div class="nav-title">Boshqaruv</div>
      <button data-page="services">⚙ Xizmatlar</button>
      <button data-page="finance">◈ Moliya</button>
      <button data-page="expenses">↘ Xarajatlar</button>
      <button data-page="reviews">☆ Sharhlar</button>
      <button data-page="ads">▣ Reklama</button>
      <div class="nav-title">Tizim</div>
      <button data-page="settings">⚙ Sozlamalar</button>
      <button id="logout">⇥ Chiqish</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;gap:12px;align-items:center">
        <button class="mobile-menu" id="menu">☰</button>
        <div>
          <h1 id="pageTitle">Boshqaruv paneli</h1>
          <div class="user">USTA24 · Andijon</div>
        </div>
      </div>
      <button class="secondary" onclick="loadPage(currentPage)">↻ Yangilash</button>
    </header>
    <div id="content"></div>
  </main>
</div>

<div id="toast"></div>

<script>
const API = "/api/admin";
let token = sessionStorage.getItem("usta24_admin_token") || "";
let currentPage = "dashboard";

const titles = {
 dashboard:"Boshqaruv paneli",orders:"Buyurtmalar",workers:"Ustalar",
 customers:"Mijozlar",services:"Xizmatlar",finance:"Moliya",
 expenses:"Xarajatlar",reviews:"Mijozlar sharhlari",ads:"Reklama",
 settings:"Sozlamalar"
};

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const money = v => Number(v||0).toLocaleString("uz-UZ")+" so'm";

function toast(msg){
 $("toast").textContent=msg;
 $("toast").style.display="block";
 setTimeout(()=>$("toast").style.display="none",3000);
}

async function api(path,method="GET",body=null){
 const headers={"Authorization":"Bearer "+token};
 if(body) headers["Content-Type"]="application/json";
 const res=await fetch(API+path,{method,headers,body:body?JSON.stringify(body):null});
 let data={};
 try{data=await res.json()}catch(e){}
 if(res.status===401||res.status===403){
  logout();
  throw new Error("Parol noto‘g‘ri yoki sessiya tugagan. Qayta kiring.");
 }
 if(!res.ok||data.success===false) throw new Error(data.error||data.message||"Xatolik yuz berdi");
 return data;
}

function logout(){
 token="";
 sessionStorage.removeItem("usta24_admin_token");
 $("app").style.display="none";
 $("login").style.display="grid";
}

$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 token=$("password").value;
 try{
  await api("/stats");
  sessionStorage.setItem("usta24_admin_token",token);
  $("login").style.display="none";
  $("app").style.display="block";
  loadPage("dashboard");
 }catch(err){
  $("loginError").textContent=err.message;
 }
});

$("logout").onclick=logout;
$("menu").onclick=()=>$("sidebar").classList.toggle("open");

document.querySelectorAll(".nav button[data-page]").forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  $("sidebar").classList.remove("open");
  loadPage(btn.dataset.page);
 };
});

async function loadPage(page){
 currentPage=page;
 $("pageTitle").textContent=titles[page]||page;
 $("content").innerHTML='<div class="panel">Ma’lumotlar yuklanmoqda...</div>';
 try{
  if(page==="dashboard") await dashboard();
  if(page==="orders") await orders();
  if(page==="workers") await workers();
  if(page==="customers") await customers();
  if(page==="services") await services();
  if(page==="finance") await finance();
  if(page==="expenses") await expenses();
  if(page==="reviews") await reviews();
  if(page==="ads") await ads();
  if(page==="settings") await settings();
 }catch(e){
  $("content").innerHTML='<div class="panel" style="color:#d84955">'+esc(e.message)+'</div>';
 }
}

function table(headers,rows){
 return '<div class="table-wrap"><table><thead><tr>'+
 headers.map(h=>'<th>'+h+'</th>').join("")+
 '</tr></thead><tbody>'+
 (rows.length?rows.join(""):'<tr><td colspan="'+headers.length+'" class="empty">Hozircha ma’lumot yo‘q</td></tr>')+
 '</tbody></table></div>';
}

function stat(label,value,icon){
 return '<div class="card"><small>'+icon+' '+label+'</small><div class="metric">'+value+'</div></div>';
}

async function dashboard(){
 const d=await api("/stats");
 const s=d.stats||{};
 $("content").innerHTML=
 '<div class="cards">'+
 stat("Jami buyurtmalar",s.total||0,"▤")+
 stat("Yangi buyurtmalar",s.new_orders||0,"◷")+
 stat("Jarayonda",s.in_progress||0,"⚙")+
 stat("Tugallangan",s.completed||0,"✓")+
 stat("Jami komissiya",money(s.commission_total),"◈")+
 stat("To‘langan",money(s.paid_total),"↗")+
 stat("Kutilayotgan",money(s.pending_total),"◷")+
 stat("Xarajatlar",money(s.expenses),"↘")+
 '</div>'+
 '<div class="panel"><h2>Moliyaviy natija</h2><div class="metric">'+money(s.profit)+'</div><p class="muted">Hisoblangan foyda</p></div>'+
 '<div class="panel"><div class="panel-head"><h2>Tezkor amallar</h2></div>'+
 '<div class="actions">'+
 '<button class="primary" onclick="loadPage(\'orders\')">Buyurtmalarni ko‘rish</button>'+
 '<button class="secondary" onclick="loadPage(\'workers\')">Ustalarni boshqarish</button>'+
 '<button class="secondary" onclick="loadPage(\'finance\')">Moliyani ko‘rish</button>'+
 '</div></div>';
}

async function orders(){
 const d=await api("/orders");
 const rows=(d.orders||[]).map(o=>'<tr>'+
 '<td>#'+esc(o.id)+'</td>'+
 '<td><b>'+esc(o.name)+'</b><br>'+esc(o.phone)+'</td>'+
 '<td>'+esc(o.service)+'</td>'+
 '<td>'+esc(o.address)+'</td>'+
 '<td>'+money(o.finance_price||o.price)+'</td>'+
 '<td><span class="tag">'+esc(o.status)+'</span></td>'+
 '<td>'+esc(o.worker_name||"Biriktirilmagan")+'</td>'+
 '<td><div class="actions"><button class="secondary" onclick="editOrder('+Number(o.id)+')">Tahrirlash</button></div></td>'+
 '</tr>');
 $("content").innerHTML='<div class="panel"><div class="panel-head"><h2>Buyurtmalar ro‘yxati</h2><button class="primary" onclick="addOrder()">+ Buyurtma qo‘shish</button></div>'+
 table(["ID","Mijoz","Xizmat","Manzil","Narx","Holat","Usta","Amal"],rows)+'</div>';
}

async function addOrder(){
 const name=prompt("Mijoz ismi:"); if(!name)return;
 const phone=prompt("Telefon raqami:"); if(!phone)return;
 const service=prompt("Xizmat turi:"); if(!service)return;
 const address=prompt("Manzil:")||"";
 const details=prompt("Qo‘shimcha ma’lumot:")||"";
 const price=Number(prompt("Narx (so‘m):")||0);
 try{
  await api("/orders","POST",{name,phone,service,address,details,source:"Admin",price});
  toast("Buyurtma qo‘shildi"); orders();
 }catch(e){toast(e.message)}
}

async function editOrder(id){
 try{
  const d=await api("/orders");
  const o=(d.orders||[]).find(x=>Number(x.id)===id);
  if(!o)throw new Error("Buyurtma topilmadi");
  const status=prompt("Holat:\nYangi\nQabul qilindi\nUstaga biriktirildi\nBajarilmoqda\nTugallandi\nBekor qilindi",o.status||"Yangi");
  if(status===null)return;
  const worker_name=prompt("Usta ismi:",o.worker_name||"")||"";
  const worker_phone=prompt("Usta telefoni:",o.worker_phone||"")||"";
  const price=Number(prompt("Buyurtma narxi:",o.finance_price||o.price||0)||0);
  await api("/orders/"+id,"PATCH",{status,worker_name,worker_phone,price});
  toast("Buyurtma yangilandi"); orders();
 }catch(e){toast(e.message)}
}

async function workers(){
 const d=await api("/ustalar");
 const rows=(d.ustalar||[]).map(w=>'<tr><td>'+esc(w.name)+'</td><td>'+esc(w.phone)+'</td><td>'+esc(w.specialty)+'</td><td><span class="tag">'+esc(w.status)+'</span></td><td><div class="actions"><button class="secondary" onclick="editWorker('+Number(w.id)+')">Tahrirlash</button><button class="danger" onclick="deactivateWorker('+Number(w.id)+')">Faolsiz</button></div></td></tr>');
 $("content").innerHTML='<div class="panel"><div class="panel-head"><h2>Ustalar ro‘yxati</h2><button class="primary" onclick="addWorker()">+ Usta qo‘shish</button></div>'+
 table(["Ism","Telefon","Mutaxassislik","Holat","Amallar"],rows)+'</div>';
}
async function addWorker(){
 const name=prompt("Usta ismi:");if(!name)return;
 const phone=prompt("Telefon:")||"";
 const specialty=prompt("Mutaxassisligi:")||"";
 try{await api("/ustalar","POST",{name,phone,specialty,status:"Faol"});toast("Usta qo‘shildi");workers()}catch(e){toast(e.message)}
}
async function editWorker(id){
 try{
  const d=await api("/ustalar");
  const w=(d.ustalar||[]).find(x=>Number(x.id)===id);if(!w)return;
  const name=prompt("Ismi:",w.name);if(name===null)return;
  const phone=prompt("Telefon:",w.phone||"")||"";
  const specialty=prompt("Mutaxassislik:",w.specialty||"")||"";
  const status=prompt("Holat: Faol yoki Nofaol",w.status||"Faol")||w.status;
  await api("/ustalar/"+id,"PATCH",{name,phone,specialty,status});
  toast("Usta yangilandi");workers();
 }catch(e){toast(e.message)}
}
async function deactivateWorker(id){
 if(!confirm("Ustani faolsiz qilasizmi?"))return;
 try{await api("/ustalar/"+id,"DELETE");toast("Usta faolsiz qilindi");workers()}catch(e){toast(e.message)}
}

async function customers(){
 const d=await api("/customers");
 const rows=(d.customers||[]).map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'</td><td>'+esc(c.orders_count)+'</td><td>'+esc(c.last_order||"—")+'</td><td><button class="secondary" onclick="customerOrders('+Number(c.id)+')">Buyurtmalari</button></td></tr>');
 $("content").innerHTML='<div class="panel"><h2>Mijozlar bazasi</h2><br>'+table(["Mijoz","Telefon","Buyurtmalar soni","Oxirgi buyurtma","Tarix"],rows)+'</div>';
}
async function customerOrders(id){
 try{
  const d=await api("/customers/"+id+"/orders");
  const rows=(d.orders||[]).map(o=>'<tr><td>#'+esc(o.id)+'</td><td>'+esc(o.service)+'</td><td>'+esc(o.status)+'</td><td>'+money(o.price)+'</td></tr>');
  $("content").innerHTML='<div class="panel"><div class="panel-head"><h2>Mijoz buyurtmalari</h2><button class="secondary" onclick="customers()">← Orqaga</button></div>'+table(["ID","Xizmat","Holat","Narx"],rows)+'</div>';
 }catch(e){toast(e.message)}
}

async function services(){
 const d=await api("/services");
 const rows=(d.services||[]).map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.description)+'</td><td>'+esc(s.status)+'</td><td><div class="actions"><button class="secondary" onclick="editService('+Number(s.id)+')">Tahrirlash</button><button class="danger" onclick="deleteService('+Number(s.id)+')">Faolsiz</button></div></td></tr>');
 $("content").innerHTML='<div class="panel"><div class="panel-head"><h2>Xizmatlar</h2><button class="primary" onclick="addService()">+ Xizmat qo‘shish</button></div>'+table(["Xizmat","Tavsif","Holat","Amallar"],rows)+'</div>';
}
async function addService(){
 const name=prompt("Xizmat nomi:");if(!name)return;
 const description=prompt("Tavsif:")||"";
 try{await api("/services","POST",{name,description});toast("Xizmat qo‘shildi");services()}catch(e){toast(e.message)}
}
async function editService(id){
 try{
  const d=await api("/services");const s=(d.services||[]).find(x=>Number(x.id)===id);if(!s)return;
  const name=prompt("Nomi:",s.name);if(name===null)return;
  const description=prompt("Tavsif:",s.description||"")||"";
  const status=prompt("Holat:",s.status||"Faol")||s.status;
  await api("/services/"+id,"PATCH",{name,description,status});toast("Saqlandi");services();
 }catch(e){toast(e.message)}
}
async function deleteService(id){
 if(!confirm("Xizmatni faolsiz qilasizmi?"))return;
 try{await api("/services/"+id,"DELETE");toast("Xizmat faolsiz qilindi");services()}catch(e){toast(e.message)}
}

async function finance(){
 const d=await api("/finance");
 const s=d.summary||{};
 const cards='<div class="cards">'+stat("Komissiya",money(s.commission),"◈")+stat("To‘langan",money(s.paid),"✓")+stat("Kutilmoqda",money(s.pending),"◷")+stat("Xarajatlar",money(s.expenses),"↘")+'</div>';
 const rows=(d.finances||[]).map(f=>'<tr><td>#'+esc(f.id)+'</td><td>#'+esc(f.order_id)+'</td><td>'+money(f.commission_amount||f.amount)+'</td><td>'+esc(f.payment_status)+'</td><td>'+(f.payment_status==="paid"?'—':'<button class="secondary" onclick="markPaid('+Number(f.id)+')">To‘landi</button>')+'</td></tr>');
 $("content").innerHTML=cards+'<div class="panel"><h2>Moliyaviy operatsiyalar</h2><br>'+table(["ID","Buyurtma","Komissiya","To‘lov holati","Amal"],rows)+'</div>';
}
async function markPaid(id){
 if(!confirm("To‘lov amalga oshirilganini tasdiqlaysizmi?"))return;
 try{await api("/finance/"+id+"/paid","PATCH",{});toast("To‘lov belgilandi");finance()}catch(e){toast(e.message)}
}

async function expenses(){
 const d=await api("/expenses");
 const rows=(d.expenses||[]).map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(x.category)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.expense_date)+'</td><td>'+esc(x.notes)+'</td></tr>');
 $("content").innerHTML='<div class="panel"><div class="panel-head"><h2>Xarajatlar</h2><button class="primary" onclick="addExpense()">+ Xarajat kiritish</button></div>'+table(["Nomi","Kategoriya","Summa","Sana","Izoh"],rows)+'</div>';
}
async function addExpense(){
 const title=prompt("Xarajat nomi:");if(!title)return;
 const category=prompt("Kategoriya:")||"Boshqa";
 const amount=Number(prompt("Summa (so‘m):")||0);
 const expense_date=prompt("Sana (YYYY-MM-DD):",new Date().toISOString().slice(0,10));
 const notes=prompt("Izoh:")||"";
 try{await api("/expenses","POST",{title,category,amount,expense_date,notes});toast("Xarajat saqlandi");expenses()}catch(e){toast(e.message)}
}

async function reviews(){
 const d=await api("/reviews");
 const rows=(d.reviews||[]).map(r=>'<tr><td>'+esc(r.customer_name)+'</td><td>'+esc(r.phone)+'</td><td>'+esc(r.rating)+'/5</td><td>'+esc(r.comment)+'</td><td>'+esc(r.status)+'</td><td><select onchange="reviewStatus('+Number(r.id)+',this.value)"><option>Kutilmoqda</option><option>Tasdiqlandi</option><option>Rad etildi</option></select></td></tr>');
 $("content").innerHTML='<div class="panel"><div class="panel-head"><h2>Mijozlar sharhlari</h2><button class="primary" onclick="addReview()">+ Sharh qo‘shish</button></div>'+table(["Mijoz","Telefon","Baho","Fikr","Holat","Boshqarish"],rows)+'</div>';
}
async function addReview(){
 const customer_name=prompt("Mijoz ismi:");if(!customer_name)return;
 const phone=prompt("Telefon:")||"";
 const rating=Number(prompt("Baho (1–5):","5")||5);
 const comment=prompt("Sharh:")||"";
 try{await api("/reviews","POST",{customer_name,phone,rating,comment});toast("Sharh qo‘shildi");reviews()}catch(e){toast(e.message)}
}
async function reviewStatus(id,status){
 try{await api("/reviews/"+id,"PATCH",{status});toast("Sharh holati saqlandi")}catch(e){toast(e.message)}
}

async function ads(){
 const d=await api("/ads");
 const rows=(d.campaigns||[]).map(a=>'<tr><td>'+esc(a.platform)+'</td><td>'+esc(a.campaign_name)+'</td><td>'+money(a.spend)+'</td><td>'+esc(a.impressions)+'</td><td>'+esc(a.clicks)+'</td><td>'+esc(a.leads)+'</td><td>'+esc(a.campaign_date)+'</td></tr>');
 $("content").innerHTML='<div class="panel"><div class="panel-head"><h2>Reklama kampaniyalari</h2><button class="primary" onclick="addAd()">+ Kampaniya qo‘shish</button></div>'+table(["Platforma","Kampaniya","Sarflangan","Ko‘rsatish","Bosish","Lidlar","Sana"],rows)+'</div>';
}
async function addAd(){
 const platform=prompt("Platforma (Instagram, Facebook):","Instagram");if(!platform)return;
 const campaign_name=prompt("Kampaniya nomi:");if(!campaign_name)return;
 const spend=Number(prompt("Sarflangan mablag‘:")||0);
 const impressions=Number(prompt("Ko‘rsatishlar soni:")||0);
 const clicks=Number(prompt("Bosishlar soni:")||0);
 const leads=Number(prompt("Murojaatlar soni:")||0);
 const campaign_date=prompt("Sana (YYYY-MM-DD):",new Date().toISOString().slice(0,10));
 const notes=prompt("Izoh:")||"";

async function settings(){
 const d=await api("/settings");
 const values={};
 (d.settings||[]).forEach(s=>values[s.setting_key]=s.setting_value);
 const fields=[
 ["business_name","Korxona nomi"],["business_phone","Telefon"],
 ["instagram","Instagram"],["telegram","Telegram"],
 ["website","Sayt"],["address","Manzil"]
 ];
 $("content").innerHTML='<div class="panel"><h2>Biznes ma’lumotlari</h2><p class="muted">Ma’lumotlarni yangilab, saqlash tugmasini bosing.</p>'+
 fields.map(([key,label])=>'<label>'+label+'</label><input id="setting_'+key+'" value="'+esc(values[key]||"")+'">').join("")+
 '<button class="primary" onclick="saveSettings()">Sozlamalarni saqlash</button></div>';
}
async function saveSettings(){
 const fields=["business_name","business_phone","instagram","telegram","website","address"];
 try{
  for(const key of fields){
   await api("/settings","POST",{setting_key:key,setting_value:$("setting_"+key).value});
  }
  toast("Sozlamalar saqlandi");
 }catch(e){toast(e.message)}
}

}
</script>
